default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV["DATABASE_URL"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  !!merge <<: *default

test:
  !!merge <<: *default
  url: <%= ENV["DATABASE_URL"]&.sub("psicolog_development", "psicolog_development") %>

production:
  !!merge <<: *default
