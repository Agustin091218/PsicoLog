services:
  db:
    image: postgres:16-alpine
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: ./bin/rails server -b 0.0.0.0
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      RAILS_ENV: development
    volumes:
      - .:/rails
      - rails_log:/rails/log
      - rails_tmp:/rails/tmp
      - rails_storage:/rails/storage
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  rails_log:
  rails_tmp:
  rails_storage:
