services:
  db:
    image: postgres:16-alpine
    env_file:
      - ${APP_ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: ./bin/rails server -b 0.0.0.0
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      RAILS_ENV: development
    volumes:
      - .:/rails
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
